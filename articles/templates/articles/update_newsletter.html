{% extends 'base.html' %}

{% block title %}Latest Newsletters{% endblock %}

{% block content %}
<body>
    <div class="container mt-5">
        <h1>Update Newsletter: {{ newsletter.title }}</h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Update Newsletter</button>
            <a href="{% url 'view_newsletters' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
