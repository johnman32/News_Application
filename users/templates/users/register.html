<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Register</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-dark text-white">
    <div>
        <h1 class="mb-4 text-center">Register</h1>
        
        <form method="POST" class="mb-3">
            {% csrf_token %}
            <div class="row mb-3 align-items-center">
                <label class="col-sm-3 col-form-label text-end">Username:</label>
                <div class="col-sm-9">
                    <input type="text" name="username" class="form-control" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label class="col-sm-3 col-form-label text-end">Email:</label>
                <div class="col-sm-9">
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label class="col-sm-3 col-form-label text-end">Password:</label>
                <div class="col-sm-9">
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>
            <div class="row mb-3 align-items-center">
                <label class="col-sm-3 col-form-label text-end">Register as:</label>
                <div class="col-sm-9">
                    <select name="role" class="form-select" required>
                        <option value="reader">Reader</option>
                        <option value="journalist">Journalist</option>
                        <option value="editor">Editor</option>
                    </select>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-light">Register</button>
            </div>
        </form>
        
        <p class="mt-3 text-center">
            <a href="{% url "view_articles" %}" class="text-white text-decoration-none">Return to home page</a>
        </p>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
