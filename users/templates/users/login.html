<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'accounts/css/accounts.css' %}">
<title>Login</title>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-dark text-white">
    <div class="text-center">
        <h1 class="mb-4">Login</h1>
        
        <form method="POST" class="mb-3">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username:</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password:</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-light me-2">Login</button>
            <a href="" class="btn btn-outline-light">Forgot Password</a>
        </form>
        
        <p class="mt-3">
            <a href="{% url 'register_user' %}" class="text-white text-decoration-none">Don't have an account? Register here.</a>
        </p>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
